name: Publish Análise de água menu fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  add-water-menu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Análise de água to primary and mobile menus
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          files = [
              "index.html",
              "diagnostico-clinico.html",
              "meios-de-cultura.html",
              "monitoramento-ambiental.html",
              "maldi.html",
              "analise-de-agua.html",
          ]

          for name in files:
              p = Path(name)
              if not p.exists():
                  continue
              s = p.read_text(encoding="utf-8")
              if 'href="analise-de-agua.html"' in s:
                  continue

              pat = re.compile(r'<a href="monitoramento-ambiental\.html"[^>]*>Monitoramento Ambiental</a>')
              counter = [0]

              def repl(m):
                  counter[0] += 1
                  if counter[0] == 1:
                      return m.group(0) + '<a href="analise-de-agua.html">Análise de água</a>'
                  if counter[0] == 2:
                      return m.group(0) + '<a href="analise-de-agua.html" onclick="closeMenu()">Análise de água</a>'
                  return m.group(0)

              out = pat.sub(repl, s)
              if out != s:
                  p.write_text(out, encoding="utf-8")

          wf = Path(".github/workflows/publish-water-menu-fix.yml")
          if wf.exists():
              wf.unlink()
          PY

          git config user.name "rbiocomercial"
          git config user.email "comercial@rbios.com.br"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Add Análise de água to site menus"
          git push
